<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growvix - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f9fafb; padding-bottom: 80px; }
        .bg-red-gradient { background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="max-w-md mx-auto text-gray-900">

    <main class="p-4 space-y-6">
        
        <!-- User Info -->
        <div class="flex items-center gap-4 py-6">
            <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-xl border-4 border-[#ff0000]/10 overflow-hidden">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=user" alt="User Avatar" class="w-full h-full object-cover">
            </div>
            <div class="flex-1">
                <h2 class="text-2xl font-bold text-gray-800">987****210</h2>
                <div class="flex items-center gap-2 mt-1">
                    <span class="bg-red-50 text-[#ff0000] px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">User</span>
                    <span class="text-xs text-gray-400 font-medium">ID: 8v2x...</span>
                </div>
            </div>
        </div>

        <!-- Balance Card -->
        <div class="bg-white rounded-3xl p-6 shadow-md border border-gray-50 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#ff0000]"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-medium">Available Balance</p>
                    <p class="text-xl font-black text-gray-800">₹5,240.50</p>
                </div>
            </div>
            <div class="flex flex-col gap-2">
                <a href="recharge.html" class="bg-[#ff0000] text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md text-center active:scale-95 transition-transform">Recharge</a>
                <a href="withdraw.html" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl text-xs font-bold text-center active:scale-95 transition-transform">Withdraw</a>
            </div>
        </div>

        <!-- Menu Links -->
        <div class="bg-white rounded-3xl shadow-md border border-gray-50 overflow-hidden divide-y divide-gray-50">
            <a href="history.html" class="w-full flex items-center justify-between p-4 active:bg-gray-50 transition-colors group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-500"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                    </div>
                    <span class="text-sm font-bold text-gray-700">Transaction History</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300"><path d="m9 18 6-6-6-6"/></svg>
            </a>
            <a href="support.html" class="w-full flex items-center justify-between p-4 active:bg-gray-50 transition-colors group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/><path d="M21 16v2a4 4 0 0 1-4 4h-5"/></svg>
                    </div>
                    <span class="text-sm font-bold text-gray-700">Customer Support</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300"><path d="m9 18 6-6-6-6"/></svg>
            </a>
            <a href="about.html" class="w-full flex items-center justify-between p-4 active:bg-gray-50 transition-colors group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-500"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>
                    </div>
                    <span class="text-sm font-bold text-gray-700">About Us</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300"><path d="m9 18 6-6-6-6"/></svg>
            </a>
            <a href="rules.html" class="w-full flex items-center justify-between p-4 active:bg-gray-50 transition-colors group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-500"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                    </div>
                    <span class="text-sm font-bold text-gray-700">Rules & Regulations</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-300"><path d="m9 18 6-6-6-6"/></svg>
            </a>
        </div>

        <a href="login.html" class="w-full bg-white text-[#ff0000] py-4 rounded-[20px] font-bold text-sm shadow-md border border-red-50 flex items-center justify-center gap-2 active:bg-red-50 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            Logout
        </a>

        <div class="text-center py-4">
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Growvix v1.0.0</p>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-100 pb-safe shadow-[0_-1px_10px_rgba(0,0,0,0.05)] max-w-md mx-auto">
        <div class="flex items-center justify-around h-16">
            <a href="index.html" class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="text-[10px] font-bold uppercase tracking-tight">Home</span>
            </a>
            <a href="product.html" class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
                <span class="text-[10px] font-bold uppercase tracking-tight">Product</span>
            </a>
            <a href="team.html" class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span class="text-[10px] font-bold uppercase tracking-tight">Team</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-[#ff0000]">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="text-[10px] font-bold uppercase tracking-tight">Profile</span>
            </a>
        </div>
    </nav>
</body>
</html>
