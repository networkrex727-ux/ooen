<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growvix - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #ffffff; }
    </style>
</head>
<body class="max-w-md mx-auto">

    <div class="min-h-screen flex flex-col p-6 relative overflow-hidden">
        
        <div class="absolute inset-0 opacity-5 pointer-events-none flex items-center justify-center">
            <img src="https://i.ibb.co/CcxW3F4/file-0000000054487208abbf2cb1db170f4e.png" alt="Background decoration" class="w-full scale-150 rotate-12">
        </div>

        <div class="flex-1 flex flex-col justify-center space-y-8 relative z-10 text-gray-900">
            
            <div class="flex items-center gap-4">
                <a href="login.html" class="p-2 bg-gray-50 rounded-xl text-gray-400 hover:text-[#ff0000] transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                </a>
                <h1 class="text-2xl font-black text-gray-800 tracking-tight">Reset Password</h1>
            </div>

            <form onsubmit="event.preventDefault(); document.getElementById('success-view').style.display='block'; this.style.display='none';" class="space-y-6">
                <div class="space-y-2">
                    <p class="text-sm text-gray-500 font-medium px-2">Enter your email address and we'll send you a link to reset your password.</p>
                    <div class="relative group">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-[#ff0000] transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </div>
                        <input type="email" placeholder="Email Address" required class="w-full bg-gray-50 border-2 border-transparent focus:border-[#ff0000] focus:bg-white rounded-[20px] py-4 pl-12 pr-4 outline-none transition-all font-bold text-gray-700">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-[#ff0000] to-[#cc0000] text-white py-4 rounded-[20px] font-black text-lg shadow-xl shadow-red-200 active:scale-95 transition-transform flex items-center justify-center gap-2">
                    Send Reset Link
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
            </form>

            <div id="success-view" class="hidden text-center space-y-6">
                <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center text-white mx-auto shadow-lg shadow-green-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </div>
                <h2 class="text-xl font-black text-green-800">Email Sent!</h2>
                <p class="text-sm text-green-600 font-medium">We've sent a password reset link to your email.</p>
                <a href="login.html" class="block w-full bg-green-500 text-white py-4 rounded-[20px] font-black text-center shadow-lg active:scale-95 transition-transform">Back to Login</a>
            </div>

            <div class="text-center">
                <p class="text-sm text-gray-500 font-medium">
                    Remember your password? <a href="login.html" class="text-[#ff0000] font-black hover:underline">Sign In</a>
                </p>
            </div>

        </div>
    </div>

</body>
</html>
