<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growvix - Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f9fafb; padding-bottom: 80px; }
        .bg-red-gradient { background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="max-w-md mx-auto text-gray-900">

    <header class="p-6 space-y-2">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#ff0000] rounded-full flex items-center justify-center text-white shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Investment Plans</h1>
        </div>
    </header>

    <main class="px-4 space-y-6">
        
        <!-- Plan 1 -->
        <div class="bg-white rounded-3xl overflow-hidden shadow-md border border-gray-50 transition-transform active:scale-95">
            <div class="relative h-40">
                <img src="https://picsum.photos/seed/vip1/400/300" alt="Plan" class="w-full h-full object-cover">
                <div class="absolute top-4 right-4 bg-[#ff0000] text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg">HOT</div>
            </div>
            <div class="p-5 space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800">VIP 1</h3>
                        <p class="text-xs text-gray-500 font-medium flex items-center gap-1 mt-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-500"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Secure Investment
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-2xl font-black text-[#ff0000]">₹500</p>
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Price</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-2 py-3 border-y border-gray-50">
                    <div class="text-center">
                        <p class="text-sm font-bold text-gray-800">₹50.00</p>
                        <p class="text-[10px] text-gray-400 font-medium">Daily</p>
                    </div>
                    <div class="text-center border-x border-gray-50">
                        <p class="text-sm font-bold text-gray-800">₹1500</p>
                        <p class="text-[10px] text-gray-400 font-medium">Total</p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm font-bold text-gray-800">30 Days</p>
                        <p class="text-[10px] text-gray-400 font-medium">Validity</p>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-4">
                    <div class="flex items-center gap-2 text-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#ff0000]"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>
                        <span class="text-xs font-bold text-gray-600">10% ROI</span>
                    </div>
                    <button class="flex-1 bg-[#ff0000] text-white py-3 rounded-2xl font-bold text-sm shadow-md active:bg-red-700 transition-colors">Invest Now</button>
                </div>
            </div>
        </div>

        <!-- Plan 2 -->
        <div class="bg-white rounded-3xl overflow-hidden shadow-md border border-gray-50 transition-transform active:scale-95">
            <div class="relative h-40">
                <img src="https://picsum.photos/seed/vip2/400/300" alt="Plan" class="w-full h-full object-cover">
                <div class="absolute top-4 right-4 bg-[#ff0000] text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg">POPULAR</div>
            </div>
            <div class="p-5 space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800">VIP 2</h3>
                        <p class="text-xs text-gray-500 font-medium flex items-center gap-1 mt-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-500"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Secure Investment
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-2xl font-black text-[#ff0000]">₹1,000</p>
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Price</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-2 py-3 border-y border-gray-50">
                    <div class="text-center">
                        <p class="text-sm font-bold text-gray-800">₹110.00</p>
                        <p class="text-[10px] text-gray-400 font-medium">Daily</p>
                    </div>
                    <div class="text-center border-x border-gray-50">
                        <p class="text-sm font-bold text-gray-800">₹3300</p>
                        <p class="text-[10px] text-gray-400 font-medium">Total</p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm font-bold text-gray-800">30 Days</p>
                        <p class="text-[10px] text-gray-400 font-medium">Validity</p>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-4">
                    <div class="flex items-center gap-2 text-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#ff0000]"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>
                        <span class="text-xs font-bold text-gray-600">11% ROI</span>
                    </div>
                    <button class="flex-1 bg-[#ff0000] text-white py-3 rounded-2xl font-bold text-sm shadow-md active:bg-red-700 transition-colors">Invest Now</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-100 pb-safe shadow-[0_-1px_10px_rgba(0,0,0,0.05)] max-w-md mx-auto">
        <div class="flex items-center justify-around h-16">
            <a href="index.html" class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="text-[10px] font-bold uppercase tracking-tight">Home</span>
            </a>
            <a href="product.html" class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-[#ff0000]">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
                <span class="text-[10px] font-bold uppercase tracking-tight">Product</span>
            </a>
            <a href="team.html" class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span class="text-[10px] font-bold uppercase tracking-tight">Team</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="text-[10px] font-bold uppercase tracking-tight">Profile</span>
            </a>
        </div>
    </nav>
</body>
</html>
