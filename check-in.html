<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growvix - Check-in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f9fafb; padding-bottom: 40px; }
        .bg-red-gradient { background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%); }
    </style>
</head>
<body class="max-w-md mx-auto text-gray-900">

    <main class="p-4 space-y-6">
        
        <header class="flex items-center gap-4 pt-2">
            <a href="index.html" class="p-2 bg-white rounded-xl text-gray-400 hover:text-[#ff0000] transition-colors shadow-sm border border-gray-50">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            </a>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">Daily Check-in</h1>
        </header>

        <div class="bg-red-gradient rounded-[30px] p-8 text-white shadow-xl relative overflow-hidden flex flex-col items-center text-center space-y-4">
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-20 h-20 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 21v-4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4"/><path d="M12 21V9"/><path d="m8 15 4-4 4 4"/></svg>
                </div>
                <h2 class="text-3xl font-black">₹10.00</h2>
                <p class="text-white/80 text-sm font-medium">Daily Reward Amount</p>
            </div>
            <div class="absolute -left-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
        </div>

        <div class="bg-white rounded-[30px] p-6 shadow-sm border border-gray-50 space-y-6">
            <h3 class="font-bold text-gray-800 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#ff0000]"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                Weekly Rewards
            </h3>
            
            <div class="grid grid-cols-7 gap-2 text-center">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center font-bold text-[10px] text-gray-400">+₹10</div>
                    <span class="text-[8px] font-bold text-gray-400 uppercase">Day 1</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center font-bold text-[10px] text-gray-400">+₹10</div>
                    <span class="text-[8px] font-bold text-gray-400 uppercase">Day 2</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center font-bold text-[10px] text-gray-400">+₹10</div>
                    <span class="text-[8px] font-bold text-gray-400 uppercase">Day 3</span>
                </div>
                <!-- ... -->
            </div>

            <button onclick="checkIn()" id="checkin-btn" class="w-full bg-gradient-to-r from-[#ff0000] to-[#cc0000] text-white py-4 rounded-[20px] font-black text-lg shadow-xl shadow-red-200 active:scale-95 transition-transform">
                Check-in Now
            </button>
        </div>

    </main>

    <script>
        function checkIn() {
            alert("Checked in successfully! You earned ₹10.00");
            const btn = document.getElementById('checkin-btn');
            btn.innerText = "Already Checked-in";
            btn.disabled = true;
            btn.classList.replace('from-[#ff0000]', 'from-gray-300');
            btn.classList.replace('to-[#cc0000]', 'to-gray-400');
        }
    </script>
</body>
</html>
