<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growvix - History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f9fafb; padding-bottom: 40px; }
    </style>
</head>
<body class="max-w-md mx-auto text-gray-900">

    <main class="p-4 space-y-6">
        
        <header class="flex items-center gap-4 pt-2">
            <a href="profile.html" class="p-2 bg-white rounded-xl text-gray-400 hover:text-[#ff0000] transition-colors shadow-sm border border-gray-50">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            </a>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">History</h1>
        </header>

        <div class="bg-white rounded-[25px] shadow-md border border-gray-50 overflow-hidden">
            <div class="flex border-b border-gray-50">
                <button onclick="filterType('recharge')" id="btn-recharge" class="flex-1 py-4 text-sm font-bold text-[#ff0000] border-b-2 border-[#ff0000] uppercase tracking-widest">Recharge</button>
                <button onclick="filterType('withdraw')" id="btn-withdraw" class="flex-1 py-4 text-sm font-bold text-gray-400 uppercase tracking-widest">Withdraw</button>
            </div>
            
            <div id="history-list" class="p-4 space-y-4 min-h-[400px]">
                <!-- Item 1 -->
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-green-50 text-green-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/><circle cx="12" cy="12" r="10"/></svg>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-800">₹2,000.00</p>
                            <p class="text-[10px] text-gray-400 font-medium">29/04/2026, 14:20</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider text-green-500 bg-green-50">
                        SUCCESS
                    </div>
                </div>
                <!-- Item 2 -->
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-green-50 text-green-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/><circle cx="12" cy="12" r="10"/></svg>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-800">₹500.00</p>
                            <p class="text-[10px] text-gray-400 font-medium">25/03/2026, 09:15</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider text-green-500 bg-green-50">
                        SUCCESS
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        function filterType(type) {
            const btnRec = document.getElementById('btn-recharge');
            const btnWit = document.getElementById('btn-withdraw');
            const list = document.getElementById('history-list');
            
            if (type === 'recharge') {
                btnRec.classList.add('text-[#ff0000]', 'border-b-2', 'border-[#ff0000]');
                btnRec.classList.remove('text-gray-400');
                btnWit.classList.remove('text-[#ff0000]', 'border-b-2', 'border-[#ff0000]');
                btnWit.classList.add('text-gray-400');
                list.innerHTML = `
                    <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-green-50 text-green-500">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/><circle cx="12" cy="12" r="10"/></svg>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-gray-800">₹2,000.00</p>
                                <p class="text-[10px] text-gray-400 font-medium">29/04/2026, 14:20</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider text-green-500 bg-green-50">SUCCESS</div>
                    </div>`;
            } else {
                btnWit.classList.add('text-[#ff0000]', 'border-b-2', 'border-[#ff0000]');
                btnWit.classList.remove('text-gray-400');
                btnRec.classList.remove('text-[#ff0000]', 'border-b-2', 'border-[#ff0000]');
                btnRec.classList.add('text-gray-400');
                list.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-2 opacity-20"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <p class="text-sm font-medium">No withdrawal history found</p>
                    </div>`;
            }
        }
    </script>
</body>
</html>
