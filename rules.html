<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growvix - Rules</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f9fafb; padding-bottom: 40px; }
    </style>
</head>
<body class="max-w-md mx-auto text-gray-900">

    <main class="p-4 space-y-6">
        
        <header class="flex items-center gap-4 pt-2">
            <a href="profile.html" class="p-2 bg-white rounded-xl text-gray-400 hover:text-[#ff0000] transition-colors shadow-sm border border-gray-50">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            </a>
            <h1 class="text-2xl font-black text-gray-800 tracking-tight">Rules</h1>
        </header>

        <div class="space-y-6">
            <div class="bg-white rounded-[30px] p-6 shadow-sm border border-gray-50 space-y-4">
                <h3 class="font-bold text-gray-800">Investment Rules</h3>
                <ul class="space-y-3">
                    <li class="flex items-start gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-500 mt-1 shrink-0"><path d="M20 6 9 17l-5-5"/></svg>
                        <p class="text-xs font-medium text-gray-600">Minimum investment starts from ₹500.</p>
                    </li>
                    <li class="flex items-start gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-500 mt-1 shrink-0"><path d="M20 6 9 17l-5-5"/></svg>
                        <p class="text-xs font-medium text-gray-600">Daily income is credited every 24 hours.</p>
                    </li>
                </ul>
            </div>

            <div class="bg-white rounded-[30px] p-6 shadow-sm border border-gray-50 space-y-4">
                <h3 class="font-bold text-gray-800">Withdrawal Rules</h3>
                <ul class="space-y-3">
                    <li class="flex items-start gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-500 mt-1 shrink-0"><path d="M20 6 9 17l-5-5"/></svg>
                        <p class="text-xs font-medium text-gray-600">Minimum withdrawal amount is ₹200.</p>
                    </li>
                    <li class="flex items-start gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-500 mt-1 shrink-0"><path d="M20 6 9 17l-5-5"/></svg>
                        <p class="text-xs font-medium text-gray-600">Withdrawal processing time: 10 AM to 6 PM.</p>
                    </li>
                </ul>
            </div>
        </div>

    </main>
</body>
</html>
