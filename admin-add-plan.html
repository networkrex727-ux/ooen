<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growvix - Add Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f9fafb; }
    </style>
</head>
<body class="max-w-md mx-auto text-gray-900">

    <header class="bg-white p-4 sticky top-0 z-40 shadow-sm flex items-center gap-4">
        <a href="admin.html" class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-600 active:scale-90 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </a>
        <div>
            <h1 class="text-lg font-black text-gray-800 uppercase tracking-tight">Add New Plan</h1>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Investment Management</p>
        </div>
    </header>

    <main class="p-4">
        <div class="bg-white rounded-[35px] p-6 shadow-xl shadow-gray-100 border border-gray-50 space-y-8">
            <div class="flex items-center gap-3 text-[#ff0000]">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                <h3 class="font-black uppercase tracking-wider text-sm">Plan Details</h3>
            </div>

            <form action="admin.html" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase">Plan Name</label>
                    <input type="text" placeholder="e.g. Premium Growth" required class="w-full bg-gray-50 border-2 border-transparent focus:border-[#ff0000] rounded-2xl py-4 px-5 outline-none font-bold text-gray-700 transition-all">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-400 uppercase">Price (₹)</label>
                        <input type="number" placeholder="500" required class="w-full bg-gray-50 border-2 border-transparent focus:border-[#ff0000] rounded-2xl py-4 px-5 outline-none font-bold text-gray-700">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-400 uppercase">Daily Income (₹)</label>
                        <input type="number" placeholder="50" required class="w-full bg-gray-50 border-2 border-transparent focus:border-[#ff0000] rounded-2xl py-4 px-5 outline-none font-bold text-gray-700">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase">Validity (Days)</label>
                    <input type="number" value="30" required class="w-full bg-gray-50 border-2 border-transparent focus:border-[#ff0000] rounded-2xl py-4 px-5 outline-none font-bold text-gray-700">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase">Image URL (Optional)</label>
                    <input type="text" placeholder="https://..." class="w-full bg-gray-50 border-2 border-transparent focus:border-[#ff0000] rounded-2xl py-4 px-5 outline-none font-bold text-gray-700">
                </div>

                <button type="submit" class="w-full bg-[#ff0000] text-white py-5 rounded-2xl font-black shadow-xl active:scale-95 transition-all text-sm uppercase tracking-widest">
                    Create Plan
                </button>
            </form>
        </div>
    </main>

</body>
</html>
